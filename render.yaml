services:
  - type: web
    name: fx-ai-trader
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 8 --worker-class gthread
    plan: pro
    disk:
      name: fx-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DB_PATH
        value: /var/data/demo_trades.db
      - key: CRON_SECRET
        sync: false
      - key: EDGE_CELL_ADMIN_TOKEN
        sync: false
      - key: EDGE_CELLS_GLOBAL_DISABLED
        sync: false

  - type: worker
    name: fx-ai-discord-bot
    runtime: node
    rootDir: services/discord_bot
    buildCommand: bun install --frozen-lockfile
    startCommand: bun run bot.ts
    plan: starter
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DISCORD_ALLOWED_USERS
        sync: false

  # ===== Phase 1 (ACTIVE): LLM不要・α予算ゼロのバックグラウンド =====

  # Tier C: 異常検知・通知 (15分毎)
  # Protocol: knowledge-base/wiki/analyses/daily-tierB-protocol.md §6
  # 検知項目: spread spike / OANDA latency / session drift / Live N stagnation
  - type: cron
    name: fx-ai-tier-c-anomaly
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "*/15 * * * *"
    startCommand: python3 scripts/anomaly_watcher.py
    plan: starter
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: API_BASE
        value: https://fx-ai-trader.onrender.com

  # Stage-3 Edge Cells: 15-min live withdrawal watchdog (offset from */15 crons)
  # LOCK: knowledge-base/wiki/decisions/edge-cells-stage3-live-promote-2026-05-26.md
  - type: cron
    name: fx-ai-edge-cell-watchdog
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 tools/edge_cell_watchdog.py --apply --to-discord
    schedule: "3,18,33,48 * * * *"
    plan: starter
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: API_BASE
        value: https://fx-ai-trader.onrender.com
      - key: EDGE_CELL_ADMIN_TOKEN
        sync: false

  # Tier A: quant gate status + α予算 要約 (1日1回 UTC 00:20)
  # daily_report.py の直前に実行 → gate状態を analyst に認識させる
  - type: cron
    name: fx-ai-tier-a-gate-status
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "20 0 * * *"
    startCommand: python3 tools/quant_gate_status.py --to-discord
    plan: starter
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false

  # Turtle System 2: USD_JPY D1 shadow-only evaluator (NY close +5m)
  - type: cron
    name: fx-ai-turtle-s2-d1
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "5 21 * * 1-5"
    startCommand: python3 scripts/turtle_s2_d1_trigger.py
    plan: starter
    envVars:
      - key: API_BASE
        value: https://fx-ai-trader.onrender.com
      - key: CRON_SECRET
        sync: false

  # Alpha Budget: 月初 reset (毎月1日 UTC 00:05)
  - type: cron
    name: fx-ai-alpha-budget-reset
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "5 0 1 * *"
    startCommand: python3 tools/alpha_budget_tracker.py --reset
    plan: starter

  # ===== Phase 2 (DRY-RUN only): LLM仮説生成 品質レビュー =====
  # scripts/daily_hypothesis_scan.py の run_bt_for_hypothesis() は skeleton。
  # --dry-run で α予算消費ゼロ・BTスキップ・仮説JSON出力のみ。
  # 本格運用 (BT+gate) は Phase 3 で startCommand から --dry-run を外す。
  #
  # 手動トリガ: Render Dashboard → fx-ai-tier-b-daily → "Trigger run now"

  - type: cron
    name: fx-ai-tier-b-daily
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "30 0 * * *"  # UTC 00:30 daily (JST 09:30)
    startCommand: python3 scripts/daily_hypothesis_scan.py --dry-run
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: API_BASE
        value: https://fx-ai-trader.onrender.com

  # Price-Shock Reversion Phase B-1 Live activation v2 watchdog (4h)
  # Live N>=10 で EV<0 or Wilson<0.40 なら auto demote state file 書込 → DemoTrader 次起動で反映
  # Live N>=30 で Bonferroni m=5 p<0.01 + 6 週 EV>0 なら lot ramp 提案 (Discord 通知のみ)
  # 関連: knowledge-base/wiki/decisions/price-shock-rev-live-activation-2026-05-18.md
  - type: cron
    name: fx-ai-price-shock-rev-watchdog
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "17 */4 * * *"  # UTC every 4h at :17 (JST :17 every 4h)
    startCommand: python3 tools/price_shock_rev_live_watchdog.py --apply --to-discord && python3 tools/price_shock_rev_promote_evaluator.py --to-discord
    plan: starter
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: API_BASE
        value: https://fx-ai-trader.onrender.com

  # ===== Phase 3 (DISABLED): Tier B-weekly =====
  # Tier B-daily に正常な pass 候補が蓄積されてから有効化する。
  # 現状 pass は生まれない (dry-run かつ BT skeleton) のでコメントアウト維持。
  #
  # - type: cron
  #   name: fx-ai-tier-b-weekly
  #   runtime: python
  #   buildCommand: pip install -r requirements.txt
  #   schedule: "0 12 * * 0"
  #   startCommand: python3 scripts/weekly_promotion_gate.py
  #   plan: starter
  #   envVars:
  #     - key: DISCORD_WEBHOOK_URL
  #       sync: false
  #     - key: GITHUB_TOKEN
  #       sync: false
