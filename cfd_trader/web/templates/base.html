<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>cfd-trader · {% block title %}dashboard{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --good: #3fb950;
      --bad: #f85149;
      --warn: #d29922;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }
    header nav { display: flex; gap: 16px; }
    header a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }
    header a:hover, header a.active { color: var(--accent); }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 500; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    .muted { color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .pill-shadow { background: rgba(88,166,255,.15); color: var(--accent); }
    .pill-live { background: rgba(63,185,80,.15); color: var(--good); }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--good));
      transition: width .3s;
    }
    .kv { display: grid; grid-template-columns: 200px 1fr; gap: 6px 24px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
    .footer { color: var(--muted); font-size: 11px; margin-top: 32px; }
  </style>
</head>
<body>
  <header>
    <h1>cfd-trader / Phase 2 shadow</h1>
    <nav>
      <a href="/" {% if active == 'overview' %}class="active"{% endif %}>overview</a>
      <a href="/progress" {% if active == 'progress' %}class="active"{% endif %}>H1 Gate progress</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
    <div class="footer">SPX500_USD M5 · OANDA candles · is_shadow=1 only</div>
  </main>
</body>
</html>
