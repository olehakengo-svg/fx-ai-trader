name: MoF Statements Daily Collect

on:
  schedule:
    - cron: '30 21 * * *'   # UTC 21:30 = JST 06:30 (前日の会見掲載 + RSS + GDELT を回収)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'

      - name: Collect (interventions / conferences / rss / gdelt)
        run: python3 tools/mof_statements_daily.py

      - name: Commit data
        id: data-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/external/mof_statements/
          echo "=== Staged files ==="
          git diff --cached --name-only
          if git diff --cached --name-only | grep -q "mof_statements/"; then
            git commit -m "data(mof-statements): daily collect $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "✅ data committed"
          else
            echo "ℹ️ No data changes to commit"
          fi

      - name: Notify failure
        if: failure()
        env:
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_ERROR_WEBHOOK_URL" ]; then exit 0; fi
          curl -s -X POST "$DISCORD_ERROR_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: FX-KB-Monitor/1.0" \
            -d "{\"content\": \"❌ **MoF Statements Daily Collect FAILED** $(date -u +%Y-%m-%d) — tools/mof_statements_daily.py 要確認\"}" || true
