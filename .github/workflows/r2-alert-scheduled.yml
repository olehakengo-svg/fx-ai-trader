name: R2 Shadow Promote Alert

on:
  schedule:
    # Every 6h UTC: 00:00, 06:00, 12:00, 18:00
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r2-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run R2 alert
        id: r2-alert
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/shadow_promote_r2_alert.py --json --include-all-static --apply-demote

      - name: Commit R2 alert report
        id: kb-commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge-base/raw/audits/
          echo "=== Staged files ==="
          git diff --cached --name-only
          if git diff --cached --name-only | grep -q "knowledge-base/raw/audits/"; then
            git commit -m "docs(KB): R2 alert $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
            echo "KB committed"
          else
            echo "No R2 alert report changes to commit"
          fi

      - name: Fail on R2 critical or fetch error
        if: steps.r2-alert.outcome != 'success'
        run: exit 1
