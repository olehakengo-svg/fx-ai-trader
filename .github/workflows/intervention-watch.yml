# E-A 介入検知器の defensive alert — 前 UTC 営業日を凍結 rule で 1 回評価
#
# rule: mof-intervention-forward-prereg-2026-07-24.md §2.2/§5.2 凍結 (X,Y)=(2.0, 0.25%)、
#       再校正禁止・as-is (E-A forward 実証 p=0.0143)。詳細と境界は
#       tools/mof_intervention_watch.py の docstring 参照。
#
# スコープ: 監視 + Discord 通知 + KB 記録のみ。live gating の自動執行はしない
#           (#4 §5.5 Variant B = 別 pre-reg + user 最終承認事項)。
#
# 到達経路の明示 (lesson-rolling-window-cache-overwrite-2026-08-14):
#   本ジョブが knowledge-base/raw/intervention_watch/YYYY-MM.jsonl を日次で進める
#   (JSONL が dedup 状態を兼ねる — 2 本目の cron は 1 本目失敗時の catch-up、成功済みなら no-op)。
name: intervention-watch

on:
  schedule:
    - cron: '20 0 * * 2-6'   # UTC-day 完成直後 (前 UTC 営業日 = 月-金 を評価)
    - cron: '50 4 * * 2-6'   # catch-up (ベンダー遅延/一時失敗の再試行、dedup で no-op)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.PAT_TOKEN }}  # main は protected — daily-report と同一の bypass 経路

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests yfinance pandas

      - name: Evaluate frozen E-A rule (previous UTC business day)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 tools/mof_intervention_watch.py run --to-discord

      - name: Commit watch record
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge-base/raw/intervention_watch/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "auto: intervention watch record ($(date -u +%F))"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
