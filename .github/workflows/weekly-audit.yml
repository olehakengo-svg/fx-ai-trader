name: Weekly Strategy Audit

on:
  schedule:
    # 毎週日曜 JST 11:00 = UTC 02:00
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      audit_type:
        description: 'Audit type (weekly or monthly)'
        required: false
        default: 'weekly'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # supply-chain: mutable tag ではなく full SHA pin (ci.yml と同一, 2026-09-10)
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Determine audit type
        id: audit-type
        env:
          # github context を run へ直接展開しない (script injection 防止)
          INPUT_TYPE: ${{ github.event.inputs.audit_type }}
        run: |
          # 月初(1-7日)の日曜なら monthly、それ以外は weekly
          DAY=$(date -u +%d)
          if [ -n "$INPUT_TYPE" ]; then
            echo "type=$INPUT_TYPE" >> $GITHUB_OUTPUT
          elif [ "$DAY" -le 7 ]; then
            echo "type=monthly" >> $GITHUB_OUTPUT
          else
            echo "type=weekly" >> $GITHUB_OUTPUT
          fi

      - name: Run audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
        run: python3 scripts/weekly_audit.py ${{ steps.audit-type.outputs.type }}

      - name: Commit KB audit
        id: kb-commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge-base/raw/audits/
          echo "=== Staged files ==="
          git diff --cached --name-only
          if git diff --cached --name-only | grep -q "knowledge-base/"; then
            git commit -m "docs(KB): ${{ steps.audit-type.outputs.type }} audit $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
            echo "✅ KB committed"
          else
            echo "ℹ️ No KB changes to commit"
          fi

      - name: Notify KB commit result
        if: always()
        env:
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_ERROR_WEBHOOK_URL" ]; then exit 0; fi
          TYPE="${{ steps.audit-type.outputs.type }}"
          if [ "${{ steps.kb-commit.outcome }}" = "success" ]; then
            MSG="✅ **KB Commit** ${TYPE}-audit $(date -u +%Y-%m-%d) — git push 成功"
          else
            MSG="❌ **KB Commit FAILED** ${TYPE}-audit $(date -u +%Y-%m-%d) — git push 失敗"
          fi
          curl -s -X POST "$DISCORD_ERROR_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: FX-KB-Monitor/1.0" \
            -d "{\"content\": \"$MSG\"}" || true

  # ── ZN cache 右端鮮度 pin (2026-09-10, rule:R3) ──────────────────────────
  # zn-cache-refresh.yml は 2026-08-17〜09-07 に 4/4 全 run が失敗していたが
  # (fetch 成功 → commit 段の git add が .gitignore に拒否され exit 1)、run の
  # 赤を読む者がいなかった。「収集済み ≠ 監視済み」— ここは cache 右端が
  # ZN_CACHE_MAX_AGE_DAYS (SSOT: modules/freshness_policy.py) を超えたら
  # Discord へ即時通知し job を落とす読み手。audit job から独立させ、audit
  # 側の失敗と互いに巻き込まないようにする。
  # 配線の counterfactual pin: tests/test_zn_cache_freshness_pin.py
  # (このステップの呼び出しを消すとテストが落ちる)。
  zn-cache-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # supply-chain: mutable tag ではなく full SHA pin (ci.yml と同一)
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet pandas pyarrow

      - name: Check ZN cache right-edge freshness
        env:
          DISCORD_ERROR_WEBHOOK_URL: ${{ secrets.DISCORD_ERROR_WEBHOOK_URL }}
        run: python3 scripts/check_zn_cache_freshness.py
